<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>VMR Simulator: U1 - Curved Track Edition</title>
    <style>
        :root { --vmr-red: #cc0000; --glass: rgba(15, 15, 20, 0.95); }
        body { margin: 0; background: #4da6ff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: white; z-index: 100; }
        #pids {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 85%; background: var(--glass); padding: 15px; border-radius: 12px;
            border-bottom: 5px solid var(--vmr-red); display: flex; justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        #selector { position: absolute; top: 120px; right: 20px; background: var(--glass); padding: 15px; border-radius: 10px; pointer-events: auto; }
        .sel-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px; margin: 5px 0; width: 100%; cursor: pointer; border-radius: 4px; font-size: 12px; }
        .sel-btn:hover { background: var(--vmr-red); }
        #dashboard { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; align-items: center; pointer-events: auto; }
        .panel { background: var(--glass); padding: 20px 40px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        #speed { font-size: 64px; color: #00ff00; font-family: 'Consolas', monospace; }
        .btn { background: #444; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div id="ui">
    <div id="pids">
        <div>
            <div style="font-size: 12px; color: #aaa;">NEXT STATION 下一站</div>
            <div id="stn-name" style="font-size: 28px; font-weight: bold;">LAUREL HILL 勞雷爾山</div>
        </div>
        <div style="text-align: right;">
            <div id="ato" style="color: #00ff00; font-weight: bold;">ATO: ACTIVE</div>
            <div style="font-size: 14px; color: var(--vmr-red);">VMR U1 - CURVE TEST</div>
        </div>
    </div>
    <div id="selector">
        <button class="sel-btn" onclick="game.changeTrain('flagship')">U1 Flagship</button>
        <button class="sel-btn" onclick="game.changeTrain('overhead')">U1-S Overhead</button>
        <button class="sel-btn" onclick="game.changeTrain('retro')">C-Line Retro</button>
    </div>
    <div id="dashboard">
        <div class="panel"><div id="speed">0</div><div style="font-size:14px; color:#888;">km/h</div></div>
        <button class="btn" onclick="game.toggleATO()">ATO ON/OFF</button>
    </div>
</div>

<script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>

<script type="module">
import * as THREE from 'three';

class CurvedVMR {
    constructor() {
        this.speed = 0;
        this.progress = 0; // 0 到 1 之間的行駛進度
        this.isATO = true;
        this.trainType = 'flagship';
        this.init();
        this.animate();
    }

    init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x4da6ff);
        this.scene.fog = new THREE.Fog(0x4da6ff, 100, 800);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        this.scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        
        // --- 核心：建立彎道曲線 ---
        this.curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -200),
            new THREE.Vector3(50, 0, -400),   // 向右彎
            new THREE.Vector3(150, 0, -600),  // 大彎
            new THREE.Vector3(100, 0, -800),  // S型反向彎
            new THREE.Vector3(0, 0, -1000)    // 回到中線
        ]);
        this.curve.curveType = 'centripetal';

        this.world = new THREE.Group();
        this.scene.add(this.world);

        this.createTrack();
        this.createTrain();
    }

    createTrack() {
        // 生成軌道模型
        const points = this.curve.getPoints(200);
        const trackGeo = new THREE.TubeGeometry(this.curve, 200, 0.2, 8, false);
        const railMat = new THREE.MeshStandardMaterial({ color: 0x777777 });
        
        // 繪製兩條鋼軌 (左右偏移)
        const railL = new THREE.Mesh(trackGeo, railMat); railL.position.x = -1.8; this.world.add(railL);
        const railR = new THREE.Mesh(trackGeo, railMat); railR.position.x = 1.8; this.world.add(railR);

        // 繪製枕木 (每隔一段距離放置一個)
        for(let i=0; i<=200; i++) {
            const pos = this.curve.getPointAt(i/200);
            const tangent = this.curve.getTangentAt(i/200);
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(5, 0.3, 1.2), new THREE.MeshStandardMaterial({color: 0x332211}));
            sleeper.position.copy(pos);
            sleeper.lookAt(pos.clone().add(tangent));
            sleeper.rotation.y += Math.PI/2;
            this.world.add(sleeper);
        }
    }

    createTrain() {
        if(this.trainGroup) this.scene.remove(this.trainGroup);
        this.trainGroup = new THREE.Group();
        
        const body = new THREE.Mesh(new THREE.BoxGeometry(5.8, 6, 20), new THREE.MeshStandardMaterial({color: 0xffdd00}));
        this.trainGroup.add(body);

        // 根據類型加細節 (簡化版邏輯)
        const head = new THREE.Mesh(new THREE.BoxGeometry(5.9, 6.1, 1), new THREE.MeshStandardMaterial({color: (this.trainType==='flagship'?0x111111:0xffdd00)}));
        head.position.z = -10;
        this.trainGroup.add(head);

        this.scene.add(this.trainGroup);
    }

    changeTrain(type) { this.trainType = type; this.createTrain(); }
    toggleATO() { this.isATO = !this.isATO; }

    animate() {
        requestAnimationFrame(() => this.animate());

        if (this.isATO) this.speed = Math.min(this.speed + 0.0005, 0.002); // Progress 增加量
        this.progress += this.speed;
        if (this.progress > 1) this.progress = 0;

        // 更新列車位置與轉向
        const pos = this.curve.getPointAt(this.progress);
        const tangent = this.curve.getTangentAt(this.progress);
        
        this.trainGroup.position.copy(pos);
        this.trainGroup.lookAt(pos.clone().add(tangent));

        // 攝影機跟隨 (放在車尾上方)
        const camOffset = tangent.clone().multiplyScalar(-30);
        this.camera.position.copy(pos).add(camOffset).add(new THREE.Vector3(0, 8, 0));
        this.camera.lookAt(pos.clone().add(tangent.clone().multiplyScalar(50)));

        document.getElementById('speed').innerText = Math.round(this.speed * 40000); // 模擬時速
        this.renderer.render(this.scene, this.camera);
    }
}
window.game = new CurvedVMR();
</script>
</body>
</html>
