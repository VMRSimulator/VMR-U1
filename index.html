<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>VMR Simulator: U1 - Pixel Edition</title>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: 'Courier New', monospace; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: #fff; text-shadow: 2px 2px #000;
        }
        .pids { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 24px; }
        .dashboard { position: absolute; bottom: 40px; width: 100%; text-align: center; }
        .speed-box { font-size: 60px; display: inline-block; background: rgba(0,0,0,0.7); padding: 10px 20px; border: 4px solid #fff; }
        .btn { pointer-events: auto; background: #cc0000; color: #fff; border: 4px solid #fff; padding: 10px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="pids">NEXT: <span id="stn">KEARNY</span></div>
    <div class="dashboard">
        <div class="speed-box"><span id="spd">0</span><br><small>km/h</small></div><br><br>
        <button class="btn" onclick="game.toggleATO()">ATO ON/OFF</button>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

class PixelVMR {
    constructor() {
        this.speed = 0;
        this.distance = 0;
        this.isATO = true;
        this.init();
        this.animate();
    }

    init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x87CEEB); // Minecraft 經典天空藍
        
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 3, 8); // 稍微抬高攝影機，像像素遊戲視角
        this.camera.lookAt(0, 2, -10);

        this.renderer = new THREE.WebGLRenderer({ antialias: false }); // 像素風不需要平滑抗鋸齒
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 10, 5);
        this.scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        this.world = new THREE.Group();
        this.scene.add(this.world);

        // --- 生成像素地面 (草地) ---
        const grassGeo = new THREE.BoxGeometry(100, 1, 2000);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x4d9343 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = -0.5;
        this.world.add(grass);

        // --- 生成像素路軌 ---
        for (let i = 0; i < 200; i++) {
            const sleeper = new THREE.Mesh(
                new THREE.BoxGeometry(5, 0.3, 1),
                new THREE.MeshStandardMaterial({ color: 0x54382b }) // 木頭色枕木
            );
            sleeper.position.z = -i * 10;
            this.world.add(sleeper);

            const railLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 10), new THREE.MeshStandardMaterial({color:0x777777}));
            railLeft.position.set(-1.5, 0.2, -i * 10);
            this.world.add(railLeft);

            const railRight = railLeft.clone();
            railRight.position.x = 1.5;
            this.world.add(railRight);
        }

        // --- 生成像素車站與房屋 ---
        const stns = [0, 500, 1000, 1500];
        stns.forEach(pos => {
            // 車站方塊
            const stn = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 30), new THREE.MeshStandardMaterial({color: 0x888888}));
            stn.position.set(12, 4, -pos);
            this.world.add(stn);

            // 旁邊的小屋 (Minecraft 風)
            for(let j=0; j<5; j++) {
                const house = new THREE.Mesh(new THREE.BoxGeometry(5, 5, 5), new THREE.MeshStandardMaterial({color: 0xeeeeee}));
                house.position.set(-15, 2.5, -pos - (j*15));
                this.world.add(house);
                // 藍色屋頂 (呼應你之前的藍陽台設定)
                const roof = new THREE.Mesh(new THREE.BoxGeometry(6, 1, 6), new THREE.MeshStandardMaterial({color: 0x0000ff}));
                roof.position.set(-15, 5.5, -pos - (j*15));
                this.world.add(roof);
            }
        });
    }

    toggleATO() { this.isATO = !this.isATO; }

    animate() {
        requestAnimationFrame(() => this.animate());
        if (this.isATO) {
            this.speed = Math.min(this.speed + 0.1, 20);
        }
        this.distance += this.speed * 0.1;
        this.world.position.z = this.distance;

        // 當跑得太遠，重置世界位置 (循環機制)
        if (this.distance > 1500) this.distance = 0;

        document.getElementById('spd').innerText = Math.round(this.speed * 4);
        this.renderer.render(this.scene, this.camera);
    }
}
window.game = new PixelVMR();
</script>
</body>
</html>
