<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMR Simulator: U1 - Vallenhurst</title>
    <style>
        :root { --vmr-red: #cc0000; --glass: rgba(15, 15, 20, 0.9); }
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        
        #pids {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; background: var(--glass); padding: 15px;
            border-radius: 10px; border-bottom: 4px solid var(--vmr-red);
            color: white; display: flex; justify-content: space-between; z-index: 10;
        }

        #dashboard {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center; z-index: 10;
        }
        .panel {
            background: var(--glass); padding: 15px 25px; border-radius: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        #speed { font-size: 48px; color: #00ff00; font-family: monospace; }
        .label { color: #aaa; font-size: 12px; margin-top: 5px; }

        .btn {
            background: #333; color: white; border: none; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-size: 14px;
        }
        .btn:active { background: var(--vmr-red); }
    </style>
</head>
<body>

<div id="pids">
    <div>
        <div style="font-size: 12px; color: #888;">NEXT STATION 下一站</div>
        <div id="stn-name" style="font-size: 24px; font-weight: bold;">KEARNY 卡尼</div>
    </div>
    <div style="text-align: right;">
        <div id="ato-status" style="color: #00ff00;">ATO: ACTIVE</div>
        <div style="font-size: 14px; color: var(--vmr-red);">VMR U1 - VALLENHURST</div>
    </div>
</div>

<div id="dashboard">
    <div class="panel"><div id="speed">0</div><div class="label">km/h</div></div>
    <div class="panel" style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn" id="atoBtn">ATO ON/OFF</button>
        <button class="btn" onclick="alert('Doors Operating...')">DOORS</button>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const STATIONS = [
    { name: "Kearny", cn: "卡尼", pos: 0 },
    { name: "Laurel Hill", cn: "勞雷爾山", pos: 1500 },
    { name: "Nam Shan", cn: "嵐山", pos: 3200 },
    { name: "Disneyland", cn: "迪士尼", pos: 5500 },
    { name: "Capitol", cn: "國會", pos: 8000 }
];

class VMRGame {
    constructor() {
        this.speed = 0;
        this.pos = 0;
        this.isATO = true;
        this.init();
        this.animate();
    }

    init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x4488ff); // 天藍色背景
        
        // 攝影機修正：near 平面設為 0.1，防止近處黑影
        this.camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 30000);
        // 攝影機位置調整：稍微往後一點，視野更廣
        this.camera.position.set(0, 2.5, 5); 

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(this.renderer.domElement);

        // 燈光
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(10, 20, 10);
        this.scene.add(light, new THREE.AmbientLight(0xffffff, 0.7));

        // 生成無限路軌 (長度增加，座標修正)
        const trackGeo = new THREE.BoxGeometry(4, 0.4, 40000);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        this.trackMesh = new THREE.Mesh(trackGeo, trackMat);
        this.trackMesh.position.set(0, 0, -20000);
        this.scene.add(this.trackMesh);

        // 生成地面
        const groundGeo = new THREE.PlaneGeometry(2000, 40000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        this.scene.add(ground);

        // 車站標誌物
        STATIONS.forEach(s => {
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(10, 8, 20),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            box.position.set(8, 4, -s.pos);
            this.scene.add(box);
        });

        document.getElementById('atoBtn').onclick = () => {
            this.isATO = !this.isATO;
            document.getElementById('ato-status').innerText = this.isATO ? "ATO: ACTIVE" : "ATO: MANUAL";
        };

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    update() {
        if (this.isATO) {
            const next = STATIONS.find(s => s.pos > this.pos + 20) || STATIONS[STATIONS.length-1];
            const dist = next.pos - this.pos;
            if (dist > 500) this.speed = Math.min(this.speed + 0.15, 25);
            else if (dist > 10) this.speed *= 0.99;
            else this.speed = 0;
            document.getElementById('stn-name').innerText = `${next.name.toUpperCase()} ${next.cn}`;
        }
        
        this.pos += this.speed * 0.15;
        this.camera.position.z = -this.pos + 5; // 相機跟隨
        document.getElementById('speed').innerText = Math.round(this.speed * 3.6);
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        this.update();
        this.renderer.render(this.scene, this.camera);
    }
}

new VMRGame();
</script>
</body>
</html>
